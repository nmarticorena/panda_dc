[workspace]
authors = ["krishan rana"]
channels = ["conda-forge"]
name = "panda_dc"
platforms = ["linux-64"]
version = "0.1.0"


[environments]
dev = ["dev"]

[tasks]
calibrate_gello = {cmd = "python3 scripts/gello/calibrate.py"}
record_demo = {cmd = "python3 scripts/record_demonstrations.py"}
test_gripper = {cmd = "python3 scripts/check_gripper.py"}
test_robotiq = {cmd = "python3 scripts/check_robotiq.py"}

[dependencies]
python="3.11.*"
reactivex = ">=4.0.4,<5"
numpy = ">=2"
scikit-build-core = ">=0.11.6,<0.12"
cmake = ">=4.1.2,<5"
hatchling = ">=1.27.0,<2"
matplotlib = ">=3.10.7,<4"
pip = ">=25.2,<26"
tyro = ">=0.9.35,<0.10"
libfranka = {version = "==0.9.2"}
pyrealsense2 = "2.56.*"
threadpoolctl = ">=3.6.0,<4"
ffmpeg = "<8"
jupyter = ">=1.1.1,<2"
inquirerpy = ">=0.3.4,<0.4"
opencv = {version = ">=4.12.0,<5", build = "*qt6*"}
ruff = ">=0.15.15,<0.16"
ty = ">=0.0.40,<0.0.41"

# Requiered for ZED Camera
cuda = "12.8.*"
compilers = ">=1.11.0,<2"
libusb = ">=1.0.29,<2"
libjpeg-turbo = ">=3.2.0,<4"
curl = ">=8.18.0,<9"

[pypi-options]
no-build-isolation = true

[pypi-dependencies]
panda_dc = {path = ".", editable = true}
swift-sim = {git = "https://github.com/nmarticorena/swift.git"}
roboticstoolbox-python = {git = "https://github.com/nmarticorena/robotics-toolbox-python.git"}
spatialgeometry = {git = "https://github.com/nmarticorena/spatialgeometry.git"}
spatialmath-python = {git = "https://github.com/nmarticorena/spatialmath-python.git"}
dynamixel-sdk = ">=3.8.4, <4"
panda-python = ">=0.8.1, <0.9"
panda-desk = {git = "https://github.com/nmarticorena/panda_desk.git"}
atomics = ">=1.0.3, <2"
pyrobotiqgripper = ">=3.2.8, <4"
pyzed = {path="./pyzed-5.0-cp311-cp311-linux_x86_64.whl"}
multiplezed = {git="https://github.com/nmarticorena/zed.git", editable = true}
ai2_robot_infra = {git = "https://github.com/allenai/ai2_robot_infra.git", extras = ["zed"]}


[activation.env]
PANDA_IP = "172.16.0.2"

[feature.dev.dependencies]
ruff = "*"
ty = "*"

[feature.dev.tasks]
format = {cmd = "ruff format panda_dc/*"}
typecheck = {cmd = "ty check"}
